# Campfire - project properties

mod_id=campfire
mod_name=Campfire
mod_author=wayback09
mod_package=com.wayback09.campfire
mod_version=0.1.0

# ---------------------------------------------------------------------------
# Fabric target (primary loader).
# The Fabric jar is compiled against exactly this Minecraft version: Loom
# remaps the mixin targets to intermediary names at build time from these
# mappings. Bumping minecraft_version here REQUIRES a matching yarn_version.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_version=1.21.11+build.6
yarn_mappings=v2
fabric_loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11
yacl_version=3.8.1+1.21.11-fabric
modmenu_version=17.0.1

# ---------------------------------------------------------------------------
# NeoForge target. Tracked separately because NeoForge pins its own Minecraft
# line - bumping the Fabric target must not silently break the NeoForge jar.
# ---------------------------------------------------------------------------
neoforge_minecraft_version=1.21.1
neoforge_version=21.1.172
yacl_neoforge_version=3.8.1+1.21.1-neoforge

java_version=21

# ---------------------------------------------------------------------------
# Build JVM settings.
# Loom remaps the Minecraft jar in-process and needs more than Gradle's
# default heap; without this the build fails with "Java heap space".
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
