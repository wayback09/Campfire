name: Build & Release Campfire

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Specific Minecraft target version (e.g. 1.21.8, 1.21.4)'
        required: false
        default: '1.21.8'

jobs:
  build:
    name: Build Fabric JAR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew :mod:fabric:build --no-daemon

      - name: Upload Fabric Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campfire-Fabric-JAR
          path: mod/fabric/build/libs/Campfire-*.jar
          if-no-files-found: error
